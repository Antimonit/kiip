<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIIP Level 5 — Study Notes</title>
<link rel="stylesheet" href="assets/style.css">
<script>
/* The theme before the first paint, so a chosen light page never flashes
   dark. KIIP.theme owns everything else about it. */
try {
  var t = localStorage.getItem("kiip-theme");
  if (t) document.documentElement.setAttribute("data-theme", t);
} catch (e) { /* no storage: the system setting stands */ }
</script>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1><a href="index.html">KIIP 5</a></h1>
    <p class="sub">사회통합프로그램 5단계 · reading notes</p>
  </header>

  <p class="progress" data-progress></p>

  <div data-list></div>
  <p class="empty" hidden data-empty></p>

</div>

<script src="assets/kiip.js"></script>
<script src="lessons/manifest.js"></script>
<script src="lessons/contents.js"></script>
<script src="assets/index.js"></script>
</body>
</html>
